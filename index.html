  <head>
    <script>
      // Suppress Vite HMR WebSocket connection logs where HMR is disabled in AI Studio
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect') || args[0].includes('vite-plugin-pwa:dev-ready') || args[0].includes('[vite] websocket'))) {
            return;
          }
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect') || args[0].includes('[vite] websocket'))) {
            return;
          }
          origWarn.apply(console, args);
        };
      })();
    </script>
